# Builds garmin-token for Windows, macOS (Apple Silicon and Intel) and Linux with PyInstaller. A pull request or a push
# only builds and runs `--version`; a tag v* also publishes a GitHub release with the programs and SHA256SUMS.txt.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: garmin-token-windows-x64.exe
          - os: macos-latest
            asset: garmin-token-macos-arm64
          - os: macos-15-intel
            asset: garmin-token-macos-x64
          - os: ubuntu-22.04
            asset: garmin-token-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: pyinstaller --onefile --name garmin-token garmin_token.py
      - name: Rename
        shell: bash
        run: |
          src=dist/garmin-token; [ -f dist/garmin-token.exe ] && src=dist/garmin-token.exe
          mv "$src" "dist/${{ matrix.asset }}"
          "dist/${{ matrix.asset }}" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "garmin-token $GITHUB_REF_NAME" \
            --notes "Download the program for your OS; checksums are in SHA256SUMS.txt. How to use it: see the README."
